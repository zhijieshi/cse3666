<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
<title>Gate-level 2-to-1 multiplexer</title>
<desc>Four gate instances n1, a1, a2 and o1 with inputs a, b, s, internal nets ns, sa, sb and output y.</desc>
<defs><linearGradient id="blue" x2="0.9" y2="1"><stop stop-color="#d8ebff"/><stop offset="1" stop-color="#b7d8fb"/></linearGradient></defs>
<g fill="none" stroke="#17202b" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
<!-- input a to a1 --> <path d="M80 92 H500"/>
<!-- select to inverter and lower AND --> <path d="M80 235 H245 M175 235 V393 H500"/>
<!-- b to lower AND --> <path d="M80 367 H500"/>
<!-- inverter output ns to upper AND --> <path d="M355 235 H425 V152 H500"/>
<!-- sa and sb --> <path d="M594 122 H705 V212 H844"/> <path d="M594 379 H705 V278 H844"/>
<!-- final y --> <path d="M950 245 H1030"/>
</g>
<!-- NOT --> <path d="M245 192 L245 278 L326 235 Z" fill="url(#blue)" stroke="#17202b" stroke-width="3.2"/><circle cx="340" cy="235" r="14" fill="white" stroke="#17202b" stroke-width="3.2"/>
<!-- AND gates same dimensions -->
<path d="M500 78 H550 A44 44 0 0 1 550 166 H500 Z" fill="url(#blue)" stroke="#17202b" stroke-width="3.2"/>
<path d="M500 335 H550 A44 44 0 0 1 550 423 H500 Z" fill="url(#blue)" stroke="#17202b" stroke-width="3.2"/>
<!-- OR gate with shallow, smoothly concave input side and curved taper -->
<path d="M815 191 Q858 193 896 214 Q927 229 950 245 Q927 261 896 276 Q858 297 815 299 Q851 245 815 191 Z" fill="url(#blue)" stroke="#17202b" stroke-width="3.2"/>
<circle cx="175" cy="235" r="5" fill="#17202b"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#101820" font-size="26">
<text x="53" y="100">a</text><text x="53" y="243">s</text><text x="53" y="375">b</text><text x="1040" y="253">y</text>
<text x="364" y="222">ns</text><text x="650" y="111">sa</text><text x="650" y="369">sb</text>
<text x="279" y="309" text-anchor="middle">n1</text><text x="550" y="61" text-anchor="middle">a1</text><text x="550" y="456" text-anchor="middle">a2</text><text x="880" y="178" text-anchor="middle">o1</text>
</g>
</svg>
